apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-booking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-booking
  template:
    metadata:
      labels:
        app: flight-booking
    spec:
      containers:
      - name: flight-booking
        image: flight-booking:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: sqlite-pvc
