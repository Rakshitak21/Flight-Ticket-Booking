apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'django-app'
        metrics_path: /metrics
        static_configs:
          - targets: ['web:8000']
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
