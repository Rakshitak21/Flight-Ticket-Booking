apiVersion: v1
kind: Namespace
metadata:
  name: flight-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-app-config
  namespace: flight-app
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  PYTHON_VERSION: "3.11.4"
---
apiVersion: v1
kind: Secret
metadata:
  name: flight-app-secret
  namespace: flight-app
type: Opaque
stringData:
  SECRET_KEY: "V7k9z4QpX2sR8mT6uY1nH0bW5cF3aL9gZqP2dS7hJ"  # Change this to your own SECRET_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-app
  namespace: flight-app
  labels:
    app: flight-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-app
  template:
    metadata:
      labels:
        app: flight-app
    spec:
      containers:
      - name: flight-app
        image: flight-app:latest  # Change to your Docker registry: your-registry/flight-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: flight-app-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: flight-app-config
              key: ALLOWED_HOSTS
        - name: PYTHON_VERSION
          valueFrom:
            configMapKeyRef:
              name: flight-app-config
              key: PYTHON_VERSION
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: flight-app-secret
              key: SECRET_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flight-app-service
  namespace: flight-app
  labels:
    app: flight-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: flight-app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-app-network-policy
  namespace: flight-app
spec:
  podSelector:
    matchLabels:
      app: flight-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: flight-app
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
